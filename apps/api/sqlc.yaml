version: "2"
sql:
  - engine: "sqlite"
    schema: "internal/app/store/schema.sql"
    queries: "internal/app/trace/queries.sql"
    gen:
      go:
        package: "tracedb"
        out: "internal/app/trace/gen"
        emit_pointers_for_null_types: true
        omit_unused_structs: true
